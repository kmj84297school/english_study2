<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc"><title id="title">귀여움과 아름다움의 서로 다른 유혹</title><desc id="desc">귀여운 디자인이면 돌보고 소중히 간직하려는 마음. 아름다운 디자인이면 소유를 통해 자신을 표현하려는 마음</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#d3dfd5"/></marker></defs><rect width="680" height="500" rx="20" fill="#1c2520"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="340" y="42" text-anchor="middle" fill="#c1d4c5" font-size="18">내용을 한눈에</text><rect x="35" y="100" width="290" height="100" rx="16" fill="#253e31" stroke="#597467"/><text x="180" y="150" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="180" dy="0">귀여운 디자인</tspan></text><rect x="355" y="100" width="290" height="100" rx="16" fill="#39352b" stroke="#597467"/><text x="500" y="150" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="500" dy="0">아름다운 디자인</tspan></text><rect x="35" y="315" width="290" height="100" rx="16" fill="#253e31" stroke="#597467"/><text x="180" y="350" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="180" dy="0">돌보고 소중히 간직하려는</tspan><tspan x="180" dy="30">마음</tspan></text><rect x="355" y="315" width="290" height="100" rx="16" fill="#39352b" stroke="#597467"/><text x="500" y="350" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="500" dy="0">소유를 통해 자신을</tspan><tspan x="500" dy="30">표현하려는 마음</tspan></text><path d="M180 214 V295" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 214 V295" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/></g></svg>