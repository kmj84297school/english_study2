<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc"><title id="title">필요할 때만 방어 장치를 만드는 물벼룩</title><desc id="desc">포식자의 화학적 흔적 있음이면 투구와 가시를 만들어 방어. 포식자의 화학적 흔적 없음이면 방어 구조를 만들지 않아 절약</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#d3dfd5"/></marker></defs><rect width="680" height="500" rx="20" fill="#1c2520"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="340" y="42" text-anchor="middle" fill="#c1d4c5" font-size="18">내용을 한눈에</text><rect x="35" y="100" width="290" height="100" rx="16" fill="#253e31" stroke="#597467"/><text x="180" y="135" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="180" dy="0">포식자의 화학적 흔적</tspan><tspan x="180" dy="30">있음</tspan></text><rect x="355" y="100" width="290" height="100" rx="16" fill="#39352b" stroke="#597467"/><text x="500" y="135" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="500" dy="0">포식자의 화학적 흔적</tspan><tspan x="500" dy="30">없음</tspan></text><rect x="35" y="315" width="290" height="100" rx="16" fill="#253e31" stroke="#597467"/><text x="180" y="350" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="180" dy="0">투구와 가시를 만들어</tspan><tspan x="180" dy="30">방어</tspan></text><rect x="355" y="315" width="290" height="100" rx="16" fill="#39352b" stroke="#597467"/><text x="500" y="350" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="500" dy="0">방어 구조를 만들지 않아</tspan><tspan x="500" dy="30">절약</tspan></text><path d="M180 214 V295" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 214 V295" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/></g></svg>