<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc"><title id="title">통신 기술 투자와 공동체의 필요</title><desc id="desc">투자자가 기대하는 수익 → 돈을 낼 수 있는 이용자 중심 운영 → 교육 등 공동체의 필요와 차이 발생</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#d3dfd5"/></marker></defs><rect width="680" height="500" rx="20" fill="#1c2520"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="340" y="42" text-anchor="middle" fill="#c1d4c5" font-size="18">내용을 한눈에</text><rect x="45" y="78" width="590" height="100" rx="16" fill="#283c31" stroke="#597467"/><text x="340" y="128" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="340" dy="0">투자자가 기대하는 수익</tspan></text><path d="M340 187 V203" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="214" width="590" height="100" rx="16" fill="#283c31" stroke="#597467"/><text x="340" y="264" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="340" dy="0">돈을 낼 수 있는 이용자 중심 운영</tspan></text><path d="M340 323 V339" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="350" width="590" height="100" rx="16" fill="#283c31" stroke="#597467"/><text x="340" y="400" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="340" dy="0">교육 등 공동체의 필요와 차이 발생</tspan></text></g></svg>