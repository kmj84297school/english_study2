<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc"><title id="title">좋은 도시는 걷기보다 머물게 한다</title><desc id="desc">걷는 사람이 많음 → 교통 불편 때문일 수도 있음 → 자발적으로 머무는지가 공간의 매력 단서</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#d3dfd5"/></marker></defs><rect width="680" height="500" rx="20" fill="#1c2520"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="340" y="42" text-anchor="middle" fill="#c1d4c5" font-size="18">내용을 한눈에</text><rect x="45" y="78" width="590" height="100" rx="16" fill="#283c31" stroke="#597467"/><text x="340" y="128" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="340" dy="0">걷는 사람이 많음</tspan></text><path d="M340 187 V203" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="214" width="590" height="100" rx="16" fill="#283c31" stroke="#597467"/><text x="340" y="264" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="340" dy="0">교통 불편 때문일 수도 있음</tspan></text><path d="M340 323 V339" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="350" width="590" height="100" rx="16" fill="#283c31" stroke="#597467"/><text x="340" y="400" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="340" dy="0">자발적으로 머무는지가 공간의 매력 단서</tspan></text></g></svg>