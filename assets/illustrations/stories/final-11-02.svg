<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc"><title id="title">천연 꿀도 섞을 수 있다</title><desc id="desc">첨가물을 넣지 않은 천연 꿀 → 여러 종류의 꿀끼리 섞기 → 더 먹기 편하고 일정한 맛</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#d3dfd5"/></marker></defs><rect width="680" height="500" rx="20" fill="#1c2520"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="340" y="42" text-anchor="middle" fill="#c1d4c5" font-size="18">내용을 한눈에</text><rect x="45" y="78" width="590" height="100" rx="16" fill="#283c31" stroke="#597467"/><text x="340" y="128" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="340" dy="0">첨가물을 넣지 않은 천연 꿀</tspan></text><path d="M340 187 V203" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="214" width="590" height="100" rx="16" fill="#283c31" stroke="#597467"/><text x="340" y="264" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="340" dy="0">여러 종류의 꿀끼리 섞기</tspan></text><path d="M340 323 V339" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="350" width="590" height="100" rx="16" fill="#283c31" stroke="#597467"/><text x="340" y="400" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="340" dy="0">더 먹기 편하고 일정한 맛</tspan></text></g></svg>