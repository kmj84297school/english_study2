<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc"><title id="title">오자와 돌연변이의 비유가 깨지는 지점</title><desc id="desc">생물에 유리한 변이이면 자손에게 전달되어 다음 세대에 확산. 책에서 우연히 개선된 오자이면 더 잘 팔리게 하는 같은 장치는 없음</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#d3dfd5"/></marker></defs><rect width="680" height="500" rx="20" fill="#1c2520"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="340" y="42" text-anchor="middle" fill="#c1d4c5" font-size="18">내용을 한눈에</text><rect x="35" y="100" width="290" height="100" rx="16" fill="#253e31" stroke="#597467"/><text x="180" y="150" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="180" dy="0">생물에 유리한 변이</tspan></text><rect x="355" y="100" width="290" height="100" rx="16" fill="#39352b" stroke="#597467"/><text x="500" y="135" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="500" dy="0">책에서 우연히 개선된</tspan><tspan x="500" dy="30">오자</tspan></text><rect x="35" y="315" width="290" height="100" rx="16" fill="#253e31" stroke="#597467"/><text x="180" y="350" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="180" dy="0">자손에게 전달되어 다음</tspan><tspan x="180" dy="30">세대에 확산</tspan></text><rect x="355" y="315" width="290" height="100" rx="16" fill="#39352b" stroke="#597467"/><text x="500" y="350" text-anchor="middle" fill="#eff5ef" font-size="22"><tspan x="500" dy="0">더 잘 팔리게 하는 같은</tspan><tspan x="500" dy="30">장치는 없음</tspan></text><path d="M180 214 V295" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 214 V295" stroke="#d3dfd5" stroke-width="3" marker-end="url(#arrow)"/></g></svg>